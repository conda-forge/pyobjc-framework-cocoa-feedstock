schema_version: 1

context:
  version: "13.0"
  name: pyobjc-framework-Cocoa

package:
  name: pyobjc-framework-cocoa
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/pyobjc_framework_cocoa-${{ version }}.tar.gz
  sha256: bb7a23941fc8d7866578dbc84e56140efd343a1d28510f530dd1dbf80807daf4

build:
  number: 0
  skip:
    - not osx
  script:
    # force pyobjc to use conda-forge's chosen SDK
    - export CFLAGS="${CFLAGS} -isysroot ${SDKROOT:-$CONDA_BUILD_SYSROOT}"
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - pip
    - setuptools
    - libffi
  run:
    - python
    - pyobjc-core ==${{ version }}
    - libffi

tests:
  - python:
      imports:
        - AppKit
        - Cocoa
        - CoreFoundation
        - Foundation
        - PyObjCTools

about:
  homepage: https://github.com/ronaldoussoren/pyobjc
  license: MIT
  license_file: LICENSE.txt
  summary: Wrappers for the Cocoa frameworks on Mac OS X
  documentation: https://pyobjc.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - xhochy
    - jschueller
    - thewchan
    - larsoner
